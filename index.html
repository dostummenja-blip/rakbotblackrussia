<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Phone Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Левая панель управления */
    .sidebar {
      width: 340px;
      background: #111827;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 1px solid #1f2937;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #374151;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-badge {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .device-info {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .device-info span {
      color: #f3f4f6;
      font-weight: 500;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }

    .btn-secondary:hover {
      background: #1e293b;
      color: #f8fafc;
    }

    /* Правая часть: вьюпорт с телефоном */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      position: relative;
    }

    .placeholder-box {
      text-align: center;
      color: #64748b;
    }

    .placeholder-box p {
      margin-top: 8px;
      font-size: 14px;
    }

    /* Рамка экрана телефона */
    .phone-container {
      width: 400px;
      height: 820px;
      background: #000;
      border-radius: 40px;
      border: 10px solid #1f2937;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px #374151;
      overflow: hidden;
      display: none;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Боковая панель -->
  <div class="sidebar">
    <div class="brand">⚡ Cloud Phone Farm</div>

    <div class="card">
      <div class="status-badge">● Онлайн</div>
      <h2>Pixel Cloud #1</h2>
      
      <div class="device-info">
        ID: <span>1530814588</span><br>
        Локация: <span>США</span><br>
        ОС: <span>Android</span>
      </div>

      <button id="btnLaunch" class="btn-primary" onclick="launchPhone()">
        Запустить телефон
      </button>

      <button id="btnNewTab" class="btn-secondary" onclick="openFullscreen()">
        ↗ Открыть в новой вкладке
      </button>
    </div>
  </div>

  <!-- Рабочая область экрана -->
  <div class="viewport">
    <div id="emptyState" class="placeholder-box">
      <h3>Устройство свободно</h3>
      <p>Нажмите «Запустить телефон», чтобы начать сессию управления</p>
    </div>

    <div id="phoneBox" class="phone-container">
      <iframe 
        id="phoneStream" 
        src="" 
        allow="autoplay; fullscreen; clipboard-read; clipboard-write">
      </iframe>
    </div>
  </div>

  <script>
    // Адрес веб-клиента с авто-подключением по твоему ID и паролю
    // Если развернут собственный сервер — замени rustdesk.com на домен/IP своего VPS
    const targetUrl = "https://rustdesk.com/web/#/connect?id=1530814588&password=Fenom1234";

    function launchPhone() {
      // Прячем заглушку и показываем рамку устройства
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('phoneBox').style.display = 'block';
      document.getElementById('btnNewTab').style.display = 'block';

      // Меняем статус кнопки
      const btn = document.getElementById('btnLaunch');
      btn.innerText = "Подключено";
      btn.style.background = "#15803d";

      // Загружаем стрим в iframe
      const frame = document.getElementById('phoneStream');
      if (frame.src !== targetUrl) {
        frame.src = targetUrl;
      }
    }

    function openFullscreen() {
      window.open(targetUrl, '_blank');
    }
  </script>
</body>
</html>
